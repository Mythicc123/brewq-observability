fullnameOverride: kps

# The stock kind control plane binds these metrics endpoints to loopback
# or requires credentials the default monitors do not have.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

prometheus:
  prometheusSpec:
    evaluationInterval: 30s
    scrapeInterval: 30s
    externalUrl: http://prometheus.localtest.me
    retention: 7d
    storageSpec:
      emptyDir: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    externalUrl: http://alertmanager.localtest.me
    resources:
      requests:
        cpu: 25m
        memory: 32Mi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      uid: prometheus

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
