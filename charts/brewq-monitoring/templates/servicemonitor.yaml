apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: brewq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brewq-monitoring.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - brewq
  selector:
    matchLabels:
      app.kubernetes.io/name: brewq
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
