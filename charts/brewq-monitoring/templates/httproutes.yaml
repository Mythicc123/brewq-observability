{{- if .Values.routes.enabled }}
{{- range $name, $port := dict "grafana" 80 "prometheus" 9090 "alertmanager" 9093 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "brewq-monitoring.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: edge
      namespace: traefik
      sectionName: web
  hostnames:
    - {{ printf "%s.localtest.me" $name | quote }}
  rules:
    - backendRefs:
        - name: kps-{{ $name }}
          port: {{ $port }}
{{- end }}
{{- end }}
